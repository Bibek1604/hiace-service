services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports: ["5432:5432"]
    volumes: ["booking_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      retries: 10

  # Web server. Runs `prisma migrate deploy` on start, then serves on http://localhost:3000.
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://booking:booking@db:5432/booking?schema=public&connect_timeout=5
      STORAGE_DIR: /data/storage
    ports: ["3000:3000"]
    volumes: ["storage_data:/data/storage"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Releases expired seat holds and delivers queued emails/SMS every 30 seconds.
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://booking:booking@db:5432/booking?schema=public&connect_timeout=5
      STORAGE_DIR: /data/storage
    volumes: ["storage_data:/data/storage"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  booking_data:
  storage_data:
