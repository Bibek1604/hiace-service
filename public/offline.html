<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fc;color:#123b75;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  main{max-width:380px}
  .art{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px #2563eb2e;font-size:38px}
  h1{margin:0 0 8px;font-size:24px}
  p{margin:0 0 22px;color:#677689;line-height:1.6}
  button{min-height:44px;padding:0 24px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="art" aria-hidden="true">🚌</div>
  <h1>You’re offline</h1>
  <p>Seat availability and bookings need an internet connection. Check your connection and try again. Any booking you already made is safe.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
